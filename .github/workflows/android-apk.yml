name: Build Android APK

on:
  push:
    branches:
      - android/apk-test
    paths:
      - 'index.html'
      - '*.js'
      - '*.json'
      - '*.png'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1

      - name: Prepare local game assets
        run: |
          mkdir -p www
          cp index.html engine.js fx.js images.js images2.js lang_ar.js story.js manifest.json sw.js icon-192.png icon-512.png www/
          test -s www/index.html
          test -s www/images2.js
          test -s www/story.js

      - name: Validate JavaScript
        run: |
          node --check engine.js
          node --check fx.js
          node --check images.js
          node --check images2.js
          node --check lang_ar.js
          node --check story.js

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: samat-fi-madina-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
